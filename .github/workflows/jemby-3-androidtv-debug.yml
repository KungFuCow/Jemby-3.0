name: J'Emby 3.0 Android TV Test APK

on:
  push:
    branches:
      - jemby-3-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Android TV debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out J'Emby 3.0
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's ubuntu-latest runner already includes Android SDK tools.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Label APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/JEmby-3.0-AndroidTV-test-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JEmby-3.0-AndroidTV-test-debug
          path: dist/JEmby-3.0-AndroidTV-test-debug.apk
          retention-days: 14
