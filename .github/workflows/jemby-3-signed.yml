name: J'Emby 3.0 Signed Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - jemby-3-development
    paths:
      - .github/workflows/jemby-3-signed.yml

permissions:
  contents: read

jobs:
  signed-apk:
    name: Build upgradeable signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out J'Emby 3.0
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Validate configured signing secrets before building the upgradeable APK.
      - name: Restore private signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.JEMBY_KEYSTORE_BASE64 }}
          JEMBY_STORE_PASSWORD: ${{ secrets.JEMBY_STORE_PASSWORD }}
          JEMBY_KEY_ALIAS: ${{ secrets.JEMBY_KEY_ALIAS }}
          JEMBY_KEY_PASSWORD: ${{ secrets.JEMBY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 JEMBY_STORE_PASSWORD JEMBY_KEY_ALIAS JEMBY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jemby3-signing.p12"
          chmod 600 "$RUNNER_TEMP/jemby3-signing.p12"
      - name: Build signed release APK
        shell: bash
        env:
          JEMBY_SIGNING_FILE: ${{ runner.temp }}/jemby3-signing.p12
          JEMBY_STORE_PASSWORD: ${{ secrets.JEMBY_STORE_PASSWORD }}
          JEMBY_KEY_ALIAS: ${{ secrets.JEMBY_KEY_ALIAS }}
          JEMBY_KEY_PASSWORD: ${{ secrets.JEMBY_KEY_PASSWORD }}
        run: |
          export JEMBY_BUILD_NUMBER=$((300000 + GITHUB_RUN_NUMBER))
          bash ./gradlew --no-daemon :app:assembleRelease
      - name: Package installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/JEmby-3.0-AndroidTV-signed.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: JEmby-3.0-AndroidTV-signed
          path: dist/JEmby-3.0-AndroidTV-signed.apk
          retention-days: 14
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/jemby3-signing.p12"
